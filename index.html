<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
	<title>3D 艺术长廊 - Grand Luxury Gallery</title>
	<style>
		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
			user-select: none;
			-webkit-user-select: none;
		}

		html, body {
			width: 100%;
			height: 100%;
			overflow: hidden;
			background-color: #0c0c10;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
			color: #e5e5eb;
		}

		#canvas-container {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			z-index: 1;
		}

		/* Cinematic Vignette Overlay */
		.vignette-overlay {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			pointer-events: none;
			z-index: 2;
			background: radial-gradient(ellipse at center, rgba(12, 12, 16, 0) 45%, rgba(6, 6, 9, 0.65) 90%, rgba(2, 2, 4, 0.85) 100%);
		}

		/* UI Layer */
		#ui-container {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			z-index: 10;
			pointer-events: none;
		}

		/* Top Brand Tag */
		.brand-header {
			position: absolute;
			top: 28px;
			left: 36px;
			display: flex;
			flex-direction: column;
			gap: 4px;
			pointer-events: auto;
		}

		.brand-title {
			font-size: 19px;
			font-weight: 700;
			letter-spacing: 4px;
			text-transform: uppercase;
			color: #f3f3f6;
			text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
		}

		.brand-subtitle {
			font-size: 11px;
			letter-spacing: 2px;
			text-transform: uppercase;
			color: #d4af37;
			font-weight: 500;
			text-shadow: 0 1px 6px rgba(0, 0, 0, 0.7);
		}

		/* Floating Bottom Control Bar */
		.control-bar {
			position: absolute;
			bottom: 30px;
			left: 50%;
			transform: translateX(-50%);
			display: flex;
			align-items: center;
			gap: 12px;
			padding: 8px 18px;
			background: rgba(22, 22, 28, 0.72);
			backdrop-filter: blur(16px);
			-webkit-backdrop-filter: blur(16px);
			border: 1px solid rgba(255, 255, 255, 0.1);
			border-radius: 40px;
			box-shadow: 0 12px 36px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.15);
			pointer-events: auto;
			transition: all 0.3s ease;
		}

		.control-btn {
			background: transparent;
			border: none;
			color: #e5e5eb;
			font-size: 13px;
			font-weight: 500;
			padding: 8px 16px;
			border-radius: 24px;
			cursor: pointer;
			display: inline-flex;
			align-items: center;
			gap: 6px;
			transition: all 0.25s ease;
			letter-spacing: 1px;
		}

		.control-btn:hover {
			background: rgba(255, 255, 255, 0.12);
			color: #ffffff;
			transform: translateY(-1px);
		}

		.control-btn:active {
			transform: translateY(1px);
		}

		.control-btn.accent {
			background: linear-gradient(135deg, rgba(212, 175, 55, 0.35), rgba(180, 140, 30, 0.25));
			border: 1px solid rgba(212, 175, 55, 0.5);
			color: #f7e7b4;
		}

		.control-btn.accent:hover {
			background: linear-gradient(135deg, rgba(212, 175, 55, 0.55), rgba(180, 140, 30, 0.45));
			color: #ffffff;
		}

		.control-divider {
			width: 1px;
			height: 20px;
			background: rgba(255, 255, 255, 0.15);
		}

		/* Keyboard / Interaction Tip */
		.hints-tag {
			position: absolute;
			bottom: 34px;
			right: 36px;
			font-size: 12px;
			color: rgba(255, 255, 255, 0.45);
			letter-spacing: 0.8px;
			display: flex;
			align-items: center;
			gap: 8px;
			background: rgba(18, 18, 22, 0.6);
			padding: 6px 14px;
			border-radius: 20px;
			border: 1px solid rgba(255, 255, 255, 0.06);
			backdrop-filter: blur(8px);
		}

		/* Focused Artwork Info Card */
		#info-card {
			position: absolute;
			bottom: 100px;
			left: 36px;
			max-width: 340px;
			padding: 20px 24px;
			background: rgba(18, 18, 24, 0.78);
			backdrop-filter: blur(20px);
			-webkit-backdrop-filter: blur(20px);
			border: 1px solid rgba(212, 175, 55, 0.35);
			border-radius: 16px;
			box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
			pointer-events: auto;
			opacity: 0;
			transform: translateY(20px);
			transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
		}

		#info-card.visible {
			opacity: 1;
			transform: translateY(0);
		}

		.info-badge {
			font-size: 11px;
			font-weight: 700;
			color: #d4af37;
			letter-spacing: 2px;
			text-transform: uppercase;
			margin-bottom: 6px;
		}

		.info-title {
			font-size: 18px;
			font-weight: 600;
			color: #ffffff;
			margin-bottom: 8px;
			letter-spacing: 0.5px;
		}

		.info-desc {
			font-size: 12px;
			line-height: 1.6;
			color: rgba(255, 255, 255, 0.65);
			margin-bottom: 16px;
		}

		.info-footer {
			display: flex;
			align-items: center;
			justify-content: space-between;
			border-top: 1px solid rgba(255, 255, 255, 0.08);
			padding-top: 12px;
		}

		.btn-close {
			background: rgba(255, 255, 255, 0.08);
			border: 1px solid rgba(255, 255, 255, 0.15);
			color: #e5e5eb;
			padding: 5px 14px;
			border-radius: 14px;
			font-size: 11px;
			cursor: pointer;
			transition: all 0.2s ease;
		}

		.btn-close:hover {
			background: rgba(255, 255, 255, 0.2);
			color: #ffffff;
		}

		@media (max-width: 768px) {
			.brand-header {
				top: 18px;
				left: 20px;
			}
			.hints-tag {
				display: none;
			}
			.control-bar {
				bottom: 18px;
				padding: 6px 12px;
				gap: 6px;
			}
			.control-btn {
				padding: 6px 12px;
				font-size: 12px;
			}
			#info-card {
				left: 20px;
				right: 20px;
				max-width: none;
				bottom: 80px;
			}
		}
	</style>
</head>
<body>

	<!-- 3D WebGL Canvas Container -->
	<div id="canvas-container"></div>

	<!-- Film Atmosphere Vignette -->
	<div class="vignette-overlay"></div>

	<!-- Interactive UI Layer -->
	<div id="ui-container">
		<!-- Top Gallery Branding -->
		<div class="brand-header">
			<div class="brand-title">3D Grand Gallery</div>
			<div class="brand-subtitle">Contemporary Exhibition · 40 Masterpieces</div>
		</div>

		<!-- Focused Artwork Card -->
		<div id="info-card">
			<div class="info-badge" id="info-badge">EXHIBITION NO. 01 / 40</div>
			<div class="info-title" id="info-title">Gallery Piece #1</div>
			<div class="info-desc">点击左/右箭头或键盘快捷键可连续浏览长廊中的精美展品。再次点击展厅空白处可平滑恢复漫游。</div>
			<div class="info-footer">
				<span style="font-size: 11px; color: rgba(255,255,255,0.4);">← / → 快捷切画</span>
				<button class="btn-close" id="btn-close-card">✕ 返回长廊</button>
			</div>
		</div>

		<!-- Floating Navigation & Control Bar -->
		<div class="control-bar">
			<button class="control-btn" id="btn-prev" title="上一张画作">‹ 上一幅</button>
			<button class="control-btn accent" id="btn-cruise" title="切换待机自动巡游">❚❚ 暂停巡游</button>
			<button class="control-btn" id="btn-next" title="下一张画作">下一幅 ›</button>
			<div class="control-divider"></div>
			<button class="control-btn" id="btn-overview" title="退出特写并回到长廊中央">⛶ 全览</button>
		</div>

		<!-- Shortcuts Hint Tag -->
		<div class="hints-tag">
			<span>← → 浏览 · 点击画作聚焦 · 拖拽自由环顾</span>
		</div>
	</div>

	<!-- 3D Scripts (100% Offline Local Files) -->
	<script src="js/three.min.js"></script>
	<script src="js/Reflector.js"></script>
	<script src="js/gallery.js"></script>

</body>
</html>
